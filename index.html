<meta name="theme-color" content="#2f7d4f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="가계부">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#1a6fd8; --blue-bg:#eaf2fd;
    --red:#d8341a; --red-bg:#fdecea;
    --ink:#1c1c1c; --sub:#5b5b5b;
    --line:#e4e0d8;
    --paper:#fffdf8;
    --card:#ffffff;
    --bg:#f4f1e9;
    --accent:#2f7d4f; --accent-bg:#e7f4ec;
    --radius:20px;
    --tap-min:64px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    font-size:19px;
    line-height:1.5;
    -webkit-text-size-adjust:100%;
    padding-bottom:120px;
    min-height:100vh;
  }
  button{font-family:inherit;}
  h1,h2,h3,p{margin:0;}
  .hidden{display:none !important;}
  img{max-width:100%;}

  /* ---------- Layout shells ---------- */
  #app, #setup-screen{max-width:560px;margin:0 auto;}

  /* ---------- Top bar ---------- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:22px 20px 10px;
  }
  .topbar .title{font-size:26px;font-weight:900;letter-spacing:-0.5px;}
  .app-version{font-size:12.5px;color:var(--sub);margin:2px 0 0 2px;}
  .status-dot{width:12px;height:12px;border-radius:50%;background:#bbb;display:inline-block;margin-right:6px;vertical-align:middle;}
  .status-dot.online{background:var(--accent);}
  .status-wrap{font-size:15px;color:var(--sub);display:flex;align-items:center;}
  .gear-link{
    font-size:15px;color:var(--sub);text-decoration:none;padding:10px;
    border-radius:12px;
  }

  /* ---------- Month switcher ---------- */
  .month-switch{
    display:flex;align-items:center;justify-content:center;gap:18px;
    padding:6px 0 18px;
  }
  .month-switch button{
    width:52px;height:52px;border-radius:50%;border:2px solid var(--line);
    background:var(--card);font-size:24px;color:var(--ink);
  }
  .month-switch .month-label{font-size:23px;font-weight:700;min-width:150px;text-align:center;}

  /* ---------- Summary card ---------- */
  .summary-card{
    margin:0 20px 22px;background:var(--card);border-radius:var(--radius);
    padding:24px 22px;box-shadow:0 2px 10px rgba(0,0,0,.05);
    border:1px solid var(--line);
  }
  .summary-row{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;}
  .summary-row .label{font-size:19px;color:var(--sub);font-weight:500;}
  .summary-row .value{font-size:26px;font-weight:900;}
  .summary-row.income .value{color:var(--blue);}
  .summary-row.expense .value{color:var(--red);}
  .summary-divider{height:1px;background:var(--line);margin:8px 0;}
  .summary-row.balance .label{font-size:20px;font-weight:700;color:var(--ink);}
  .summary-row.balance .value{font-size:30px;color:var(--accent);}

  /* ---------- Main tabs (내역 / 통계) ---------- */
  .main-tabs{display:flex;gap:10px;padding:0 20px 16px;}
  .tab-btn{
    flex:1;min-height:58px;border-radius:16px;border:3px solid var(--line);
    background:var(--card);font-size:18px;font-weight:800;color:var(--sub);
  }
  .tab-btn.active{border-color:var(--accent);background:var(--accent-bg);color:var(--accent);}

  /* ---------- Transaction list ---------- */
  .list-section{padding:0 20px;}
  .date-heading{
    font-size:17px;font-weight:700;color:var(--sub);
    margin:22px 4px 8px;
  }
  .tx-row{
    display:flex;align-items:center;gap:14px;
    background:var(--card);border:1px solid var(--line);
    border-radius:16px;padding:16px 16px;margin-bottom:10px;
    min-height:var(--tap-min);
    cursor:pointer;
  }
  .tx-row:active{background:#f7f5ee;}
  .tx-icon{
    width:52px;height:52px;border-radius:14px;flex:none;
    display:flex;align-items:center;justify-content:center;font-size:26px;
  }
  .tx-icon.expense{background:var(--red-bg);}
  .tx-icon.income{background:var(--blue-bg);}
  .tx-main{flex:1;min-width:0;}
  .tx-cat{font-size:19px;font-weight:700;}
  .tx-memo{font-size:15px;color:var(--sub);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tx-amount{font-size:21px;font-weight:900;flex:none;white-space:nowrap;}
  .tx-amount.expense{color:var(--red);}
  .tx-amount.income{color:var(--blue);}
  .tx-actions{display:flex;flex-direction:column;gap:6px;flex:none;}
  .tx-edit-btn, .tx-delete-btn{
    width:38px;height:38px;border-radius:10px;border:none;
    background:#00000008;font-size:18px;
    display:flex;align-items:center;justify-content:center;
  }
  .tx-edit-btn:active, .tx-delete-btn:active{background:#00000016;}
  .empty-msg{
    text-align:center;color:var(--sub);font-size:18px;padding:60px 20px;
  }

  /* ---------- Stats tab ---------- */
  .stat-section{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px 20px 6px;margin-bottom:18px;}
  .stat-section h3{font-size:19px;font-weight:800;margin:0 0 16px;}
  .stat-cat-row{margin-bottom:16px;}
  .stat-cat-head{display:flex;justify-content:space-between;align-items:baseline;font-size:17px;font-weight:700;margin-bottom:6px;gap:10px;}
  .stat-cat-head .cat-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .stat-cat-head .cat-amt{flex:none;color:var(--sub);font-weight:800;}
  .stat-bar-track{height:14px;background:var(--line);border-radius:8px;overflow:hidden;}
  .stat-bar-fill{height:100%;border-radius:8px;}
  .stat-empty{color:var(--sub);font-size:16px;text-align:center;padding:14px 0 20px;}

  /* ---------- Bottom action bar ---------- */
  .bottom-bar{
    position:fixed;left:0;right:0;bottom:0;
    max-width:560px;margin:0 auto;
    display:flex;gap:12px;padding:14px 16px calc(14px + env(safe-area-inset-bottom));
    background:linear-gradient(to top, var(--bg) 65%, transparent);
  }
  .big-btn{
    flex:1;min-height:76px;border-radius:20px;border:none;
    font-size:21px;font-weight:800;color:#fff;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    box-shadow:0 4px 14px rgba(0,0,0,.18);
  }
  .big-btn .emoji{font-size:26px;}
  .big-btn.receipt{background:var(--accent);}
  .big-btn.manual{background:var(--blue);}
  .big-btn:active{filter:brightness(0.92);}

  /* ---------- Generic modal ---------- */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(20,18,10,.5);
    display:flex;align-items:flex-end;justify-content:center;
    z-index:50;
  }
  .modal-sheet{
    background:var(--paper);width:100%;max-width:560px;
    border-radius:26px 26px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom));
    max-height:92vh;overflow-y:auto;
  }
  .modal-title{font-size:24px;font-weight:900;margin-bottom:18px;text-align:center;}
  .modal-close{
    position:absolute;top:18px;right:18px;width:44px;height:44px;
    border-radius:50%;border:none;background:#00000010;font-size:20px;color:var(--sub);
  }
  .modal-sheet{position:relative;}

  /* ---------- Segmented type toggle ---------- */
  .type-toggle{display:flex;gap:10px;margin-bottom:20px;}
  .type-toggle button{
    flex:1;min-height:64px;border-radius:16px;border:3px solid var(--line);
    background:var(--card);font-size:21px;font-weight:800;color:var(--sub);
  }
  .type-toggle button.active.expense{border-color:var(--red);background:var(--red-bg);color:var(--red);}
  .type-toggle button.active.income{border-color:var(--blue);background:var(--blue-bg);color:var(--blue);}

  /* ---------- Category grid ---------- */
  .field-label{font-size:18px;font-weight:700;color:var(--sub);margin:18px 2px 10px;}
  .cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  .cat-btn{
    min-height:78px;border-radius:16px;border:3px solid var(--line);background:var(--card);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    font-size:14px;font-weight:700;color:var(--ink);
  }
  .cat-btn .emoji{font-size:26px;}
  .cat-btn.active{border-color:var(--accent);background:var(--accent-bg);color:var(--accent);}

  /* ---------- Amount / date / memo inputs ---------- */
  .amount-wrap{
    display:flex;align-items:baseline;justify-content:center;gap:8px;
    background:var(--card);border:3px solid var(--line);border-radius:18px;
    padding:14px 16px;margin-top:4px;
  }
  .amount-wrap input{
    border:none;outline:none;background:transparent;
    font-size:38px;font-weight:900;text-align:right;width:100%;color:var(--ink);
    font-family:inherit;
  }
  .amount-wrap input::placeholder{color:#c9c3b3;font-weight:700;}
  .amount-wrap .won{font-size:24px;font-weight:700;color:var(--sub);}
  input[type="date"], input.text-input{
    width:100%;min-height:var(--tap-min);border:3px solid var(--line);border-radius:16px;
    background:var(--card);font-size:19px;padding:0 16px;font-family:inherit;color:var(--ink);
  }
  input[type="date"]{font-size:20px;}

  .modal-actions{display:flex;gap:12px;margin-top:26px;}
  .action-btn{
    flex:1;min-height:68px;border-radius:18px;border:none;font-size:21px;font-weight:800;
  }
  .action-btn.save{background:var(--accent);color:#fff;}
  .action-btn.save:active{filter:brightness(0.92);}
  .action-btn.delete{background:var(--red-bg);color:var(--red);}
  .action-btn.cancel{background:#eee;color:var(--sub);}

  /* ---------- Receipt flow ---------- */
  .receipt-pick{
    display:flex;flex-direction:column;align-items:center;gap:18px;padding:20px 10px 10px;
  }
  .receipt-pick .big-emoji{font-size:64px;}
  .receipt-pick p{font-size:19px;color:var(--sub);text-align:center;}
  .receipt-pick .pick-btn{
    width:100%;min-height:80px;border-radius:20px;border:none;background:var(--accent);
    color:#fff;font-size:22px;font-weight:800;
  }
  .receipt-thumb{width:100%;max-height:220px;object-fit:contain;border-radius:16px;background:#00000008;margin-bottom:14px;}

<!-- ================= Firebase SDK ================= -->
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>

<!-- 영수증 OCR은 Google Cloud Vision API를 fetch로 직접 호출해서 처리함 (별도 스크립트 불필요) -->

<script>
/* =========================================================================
   우리집 가계부 (부모님용) — app.js
   - localStorage에 Firebase 설정 + 가족 코드를 저장해두고
   - Firestore 실시간 동기화로 부모님/자녀 기기가 같은 데이터를 봄
   - 영수증 사진은 Google Cloud Vision API로 글자를 읽어서 금액/날짜를 자동으로 채움
   ========================================================================= */

// 우리집 전용 Firebase 프로젝트 — 이미 이 프로젝트로 고정돼 있어서
// 기기마다 따로 연결 정보를 입력할 필요가 없어요 (그냥 주소만 열면 접속됨).
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBjEgVoXe0lgFkWkGI8_RMgOHB24ihBFhI",
  authDomain: "parent-gagyebu.firebaseapp.com",
  projectId: "parent-gagyebu",
  storageBucket: "parent-gagyebu.firebasestorage.app",
  messagingSenderId: "818650925484",
  appId: "1:818650925484:web:203ec7aeb0fc30fbbed209",
};
const FAMILY_ID = 'main';

// ⬇️ 구글 클라우드 콘솔에서 발급받은 Vision API 키를 아래 따옴표 사이에 붙여넣으세요.
// (반드시 "HTTP 리퍼러 제한"을 우리 앱 주소로 걸어두신 키를 사용하세요 — 가이드 문서 참고)
const GOOGLE_VISION_API_KEY = 'PASTE_YOUR_VISION_API_KEY_HERE';
const APP_VERSION = 'v1.5.2';

const CATEGORIES = {
  expense: [
    { key: 'food',      label: '식비',       emoji: '🍚' },
    { key: 'daily',     label: '마트/시장',   emoji: '🛒' },
    { key: 'medical',   label: '의료/약국',   emoji: '💊' },
    { key: 'transport', label: '교통비',      emoji: '🚌' },
    { key: 'event',     label: '경조사비',    emoji: '🎁' },
    { key: 'bill',      label: '통신/공과금', emoji: '📱' },
    { key: 'hobby',     label: '취미/여가',   emoji: '🎣' },
    { key: 'etc',       label: '기타',        emoji: '📦' },
  ],
  income: [
    { key: 'salary',    label: '급여',        emoji: '💼' },
    { key: 'pension',   label: '연금',        emoji: '🏦' },
    { key: 'allowance', label: '용돈',        emoji: '💵' },
    { key: 'interest',  label: '이자/배당',   emoji: '💰' },
    { key: 'etc',       label: '기타',        emoji: '📦' },
  ],
};

// ---------------------------------------------------------------------
// State
// ---------------------------------------------------------------------
let firestoreDb = null;
let colRef = null;
let unsubscribeFn = null;
let allTx = [];             // every transaction loaded from Firestore
let viewDate = new Date();  // which month is being viewed
let currentTab = 'list';    // 'list' (내역) or 'stats' (통계)
let editingId = null;       // transaction id being edited, or null = new
let currentType = 'expense';
let currentCategory = null;
let receiptHintShown = false;
let currentReceiptPhotoUrl = null; // 입력 화면에 같이 보여주는 영수증 사진(object URL), 닫을 때 해제

// ---------------------------------------------------------------------
// Small helpers
// ---------------------------------------------------------------------
function $(sel) { return document.querySelector(sel); }
function pad2(n) { return String(n).padStart(2, '0'); }
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
}
function formatWon(n) {
  return new Intl.NumberFormat('ko-KR').format(Math.round(n || 0)) + '원';
}
function toast(msg, ms = 2200) {
  const el = $('#toast');
  el.textContent = msg;
  el.classList.remove('hidden');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.add('hidden'), ms);
}
function show(el) { el.classList.remove('hidden'); }
function hide(el) { el.classList.add('hidden'); }

function showConfirm(message, onYes) {
  $('#confirm-message').textContent = message;
  show($('#confirm-modal'));
  const yesBtn = $('#confirm-yes');
  const noBtn = $('#confirm-no');
  const cleanup = () => {
    hide($('#confirm-modal'));
    yesBtn.onclick = null;
    noBtn.onclick = null;
  };
  yesBtn.onclick = () => { cleanup(); onYes(); };
  noBtn.onclick = cleanup;
}

// ---------------------------------------------------------------------
// 설정 화면 (⚙️ 설정 눌렀을 때만 보이는 보조 화면 — 내보내기 등)
// ---------------------------------------------------------------------
function renderSettingsScreen() {
  const wrap = $('#setup-screen');
  wrap.innerHTML = `
    <div class="setup-header">
      <div class="emoji">💰</div>
      <h1>설정</h1>
      <p>우리집 가계부에 연결되어 있어요.</p>
    </div>

    <div class="setup-card">
      <h2>내보내기</h2>
      <p style="font-size:14px;color:var(--sub);margin-bottom:12px;">이번 달 내역을 CSV 파일로 저장해요.</p>
      <div class="setup-actions"><button type="button" class="btn-secondary" id="export-csv-btn">CSV로 내보내기</button></div>
    </div>

    <div class="setup-actions">
      <button type="button" class="btn-primary" id="setup-back-btn">가계부로 돌아가기</button>
    </div>
  `;
  $('#export-csv-btn').onclick = exportCsv;
  $('#setup-back-btn').onclick = () => { hide(wrap); show($('#app')); show($('#bottom-bar')); };
}

// ---------------------------------------------------------------------
// Firebase init — 이 파일 안에 이미 연결 정보가 들어있어서 별도 입력 없이 바로 접속됨
// ---------------------------------------------------------------------
function initFirebase() {
  try {
    if (!firebase.apps || !firebase.apps.length) {
      firebase.initializeApp(FIREBASE_CONFIG);
    }
    firestoreDb = firebase.firestore();
    firestoreDb.enablePersistence({ synchronizeTabs: true }).catch(() => { /* ignore: unsupported or multi-tab */ });

    firebase.auth().onAuthStateChanged((user) => {
      if (user) {
        colRef = firestoreDb.collection('families').doc(FAMILY_ID).collection('transactions');
        startListening();
        showMainApp();
      }
    });
    firebase.auth().signInAnonymously().catch((err) => {
      handleInitFailure('로그인에 실패했어요: ' + err.message);
    });
  } catch (err) {
    handleInitFailure('연결에 문제가 있어요: ' + err.message);
  }
}

function handleInitFailure(msg) {
  const wrap = $('#setup-screen');
  wrap.innerHTML = `
    <div class="setup-header">
      <div class="emoji">⚠️</div>
      <h1>연결에 실패했어요</h1>
      <p>${msg}</p>
    </div>
    <div class="setup-note" style="margin-bottom:18px;">인터넷 연결을 확인하신 뒤 다시 시도해주세요.</div>
    <div class="setup-actions"><button type="button" class="btn-primary" id="retry-btn">다시 시도</button></div>
  `;
  $('#retry-btn').onclick = () => location.reload();
  show(wrap);
  hide($('#app'));
  hide($('#bottom-bar'));
}

function startListening() {
  if (unsubscribeFn) unsubscribeFn();
  unsubscribeFn = colRef.orderBy('date', 'desc').onSnapshot(
    (snap) => {
      allTx = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      render();
      setStatus(true);
    },
    (err) => {
      toast('동기화 오류: ' + err.message, 3500);
      setStatus(false);
    }
  );
}

function setStatus(ok) {
  const dot = $('#status-dot');
  const text = $('#status-text');
  if (ok && navigator.onLine) {
    dot.classList.add('online');
    text.textContent = '연결됨';
  } else {
    dot.classList.remove('online');
    text.textContent = navigator.onLine ? '연결중' : '오프라인(저장 대기중)';
  }
}
window.addEventListener('online', () => setStatus(true));
window.addEventListener('offline', () => setStatus(false));

function showMainApp() {
  hide($('#setup-screen'));
  show($('#app'));
  show($('#bottom-bar'));
  render();
}

// ---------------------------------------------------------------------
// List / summary rendering
// ---------------------------------------------------------------------
function monthKey(d) { return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}`; }

// 화면 전체 갱신: 상단 월/요약은 항상 갱신하고, 아래는 현재 탭(내역/통계)에 맞는 내용을 그림
function render() {
  const key = monthKey(viewDate);
  $('#month-label').textContent = `${viewDate.getFullYear()}년 ${viewDate.getMonth() + 1}월`;

  const monthTx = allTx.filter((t) => t.date && t.date.startsWith(key));

  let income = 0, expense = 0;
  monthTx.forEach((t) => { if (t.type === 'income') income += Number(t.amount) || 0; else expense += Number(t.amount) || 0; });
  $('#sum-income').textContent = formatWon(income);
  $('#sum-expense').textContent = formatWon(expense);
  $('#sum-balance').textContent = formatWon(income - expense);

  if (currentTab === 'stats') {
    renderStats(monthTx);
  } else {
    renderTxList(monthTx);
  }
}

function switchTab(tab) {
  currentTab = tab;
  $('#tab-list').classList.toggle('active', tab === 'list');
  $('#tab-stats').classList.toggle('active', tab === 'stats');
  $('#list-section').classList.toggle('hidden', tab !== 'list');
  $('#stats-section').classList.toggle('hidden', tab !== 'stats');
  render();
}

function renderTxList(monthTx) {
  // group by date desc
  const byDate = new Map();
  monthTx
    .slice()
    .sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0))
    .forEach((t) => {
      if (!byDate.has(t.date)) byDate.set(t.date, []);
      byDate.get(t.date).push(t);
    });

  const section = $('#list-section');
  if (byDate.size === 0) {
    section.innerHTML = `<div class="empty-msg">이 달에는 아직 기록이 없어요.<br>아래 버튼으로 입력해보세요 🙂</div>`;
    return;
  }

  let html = '';
  for (const [date, items] of byDate) {
    const d = new Date(date + 'T00:00:00');
    const weekday = ['일', '월', '화', '수', '목', '금', '토'][d.getDay()];
    html += `<div class="date-heading">${d.getMonth() + 1}월 ${d.getDate()}일 (${weekday})</div>`;
    for (const t of items) {
      const cat = findCategory(t.type, t.category);
      html += `
        <div class="tx-row" data-id="${t.id}">
          <div class="tx-icon ${t.type}">${cat ? cat.emoji : '📦'}</div>
          <div class="tx-main">
            <div class="tx-cat">${cat ? cat.label : '기타'}</div>
            ${t.memo ? `<div class="tx-memo">${escapeHtml(t.memo)}</div>` : ''}
          </div>
          <div class="tx-amount ${t.type}">${t.type === 'income' ? '+' : '-'}${formatWon(t.amount)}</div>
          <div class="tx-actions">
            <button type="button" class="tx-edit-btn" data-id="${t.id}" aria-label="수정">✏️</button>
            <button type="button" class="tx-delete-btn" data-id="${t.id}" aria-label="삭제">🗑️</button>
          </div>
        </div>`;
    }
  }
  section.innerHTML = html;

  section.querySelectorAll('.tx-row').forEach((row) => {
    row.addEventListener('click', () => {
      const t = allTx.find((x) => x.id === row.dataset.id);
      if (t) openEntryModal(t);
    });
  });
  section.querySelectorAll('.tx-edit-btn').forEach((btn) => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const t = allTx.find((x) => x.id === btn.dataset.id);
      if (t) openEntryModal(t);
    });
  });
  section.querySelectorAll('.tx-delete-btn').forEach((btn) => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const t = allTx.find((x) => x.id === btn.dataset.id);
      if (!t) return;
      showConfirm('이 내역을 삭제할까요?', () => {
        colRef.doc(t.id).delete()
          .then(() => toast('삭제했어요'))
          .catch((err) => toast('삭제 실패: ' + err.message));
      });
    });
  });
}

// 통계 탭: 카테고리별 지출(과 수입) 정리
function renderStats(monthTx) {
  const section = $('#stats-section');
  const expenseHtml = renderCategoryBreakdown('expense', monthTx, 'var(--red)');
  const incomeHtml = renderCategoryBreakdown('income', monthTx, 'var(--blue)');

  section.innerHTML = `
    <div class="stat-section">
      <h3>📊 카테고리별 지출</h3>
      ${expenseHtml}
    </div>
    <div class="stat-section">
      <h3>💵 카테고리별 수입</h3>
      ${incomeHtml}
    </div>
  `;
}

function renderCategoryBreakdown(type, monthTx, barColor) {
  const rows = monthTx.filter((t) => t.type === type);
  if (!rows.length) {
    return `<div class="stat-empty">이 달에는 ${type === 'expense' ? '지출' : '수입'} 기록이 없어요.</div>`;
  }
  const total = rows.reduce((sum, t) => sum + (Number(t.amount) || 0), 0);
  const byCat = new Map();
  rows.forEach((t) => {
    const key = t.category || 'etc';
    byCat.set(key, (byCat.get(key) || 0) + (Number(t.amount) || 0));
  });
  const sorted = [...byCat.entries()].sort((a, b) => b[1] - a[1]);

  return sorted.map(([key, amt]) => {
    const cat = findCategory(type, key);
    const pct = total > 0 ? Math.round((amt / total) * 100) : 0;
    return `
      <div class="stat-cat-row">
        <div class="stat-cat-head">
          <span class="cat-name">${cat ? cat.emoji : '📦'} ${cat ? cat.label : '기타'}</span>
          <span class="cat-amt">${formatWon(amt)} (${pct}%)</span>
        </div>
        <div class="stat-bar-track"><div class="stat-bar-fill" style="width:${pct}%;background:${barColor};"></div></div>
      </div>`;
  }).join('');
}

function findCategory(type, key) {
  return (CATEGORIES[type] || []).find((c) => c.key === key);
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// ---------------------------------------------------------------------
// Entry modal (manual add / edit / receipt-prefill)
// ---------------------------------------------------------------------
function renderCatGrid() {
  const grid = $('#cat-grid');
  grid.innerHTML = CATEGORIES[currentType]
    .map(
      (c) => `<button type="button" class="cat-btn ${c.key === currentCategory ? 'active' : ''}" data-key="${c.key}">
        <span class="emoji">${c.emoji}</span>${c.label}
      </button>`
    )
    .join('');
  grid.querySelectorAll('.cat-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      currentCategory = btn.dataset.key;
      renderCatGrid();
    });
  });
}

function setEntryType(type) {
  currentType = type;
  if (!findCategory(type, currentCategory)) currentCategory = null;
  $('#type-expense').classList.toggle('active', type === 'expense');
  $('#type-income').classList.toggle('active', type === 'income');
  renderCatGrid();
}

function openEntryModal(tx, prefill) {
  editingId = tx ? tx.id : null;
  currentType = tx ? tx.type : (prefill && prefill.type) || 'expense';
  currentCategory = tx ? tx.category : (prefill && prefill.category) || null;

  $('#entry-title').textContent = tx ? '내역 수정' : '직접 입력';
  $('#type-expense').classList.toggle('active', currentType === 'expense');
  $('#type-income').classList.toggle('active', currentType === 'income');
  renderCatGrid();

  const amount = tx ? tx.amount : (prefill && prefill.amount) || '';
  $('#amount-input').value = amount ? new Intl.NumberFormat('ko-KR').format(amount) : '';
  $('#date-input').value = tx ? tx.date : (prefill && prefill.date) || todayStr();
  $('#memo-input').value = tx ? tx.memo || '' : (prefill && prefill.memo) || '';

  $('#delete-row').style.display = tx ? 'flex' : 'none';

  // receipt 자동인식 안내문 + 촬영한 사진(비교하면서 고치기 쉽게)
  const existingHint = $('#entry-ocr-hint');
  if (existingHint) existingHint.remove();
  const existingThumb = $('#entry-receipt-thumb');
  if (existingThumb) existingThumb.remove();
  if (currentReceiptPhotoUrl) { URL.revokeObjectURL(currentReceiptPhotoUrl); currentReceiptPhotoUrl = null; }

  if (prefill && !tx) {
    const hint = document.createElement('div');
    hint.id = 'entry-ocr-hint';
    hint.className = 'ocr-hint';
    hint.textContent = '📷 영수증에서 자동으로 읽었어요. 금액·분류가 맞는지 꼭 확인 후 저장해주세요!';
    $('#entry-title').insertAdjacentElement('afterend', hint);

    if (prefill.photoUrl) {
      currentReceiptPhotoUrl = prefill.photoUrl;
      const thumb = document.createElement('img');
      thumb.id = 'entry-receipt-thumb';
      thumb.className = 'entry-receipt-thumb';
      thumb.alt = '촬영한 영수증 사진';
      thumb.src = prefill.photoUrl;
      hint.insertAdjacentElement('afterend', thumb);
    }
  }

  show($('#entry-modal'));
}

function closeEntryModal() {
  hide($('#entry-modal'));
  editingId = null;
  if (currentReceiptPhotoUrl) { URL.revokeObjectURL(currentReceiptPhotoUrl); currentReceiptPhotoUrl = null; }
}

function saveEntry() {
  const rawAmount = $('#amount-input').value.replace(/[^0-9]/g, '');
  const amount = parseInt(rawAmount, 10);
  const date = $('#date-input').value || todayStr();
  const memo = $('#memo-input').value.trim();

  if (!currentCategory) return toast('분류를 선택해주세요.');
  if (!amount || amount <= 0) return toast('금액을 입력해주세요.');

  const data = { type: currentType, category: currentCategory, amount, date, memo };

  const finish = () => { closeEntryModal(); toast('저장했어요 ✓'); };
  if (editingId) {
    colRef.doc(editingId).update(data).then(finish).catch((e) => toast('저장 실패: ' + e.message));
  } else {
    data.createdAt = firebase.firestore.FieldValue.serverTimestamp();
    colRef.add(data).then(finish).catch((e) => toast('저장 실패: ' + e.message));
  }
}

function deleteEntry() {
  if (!editingId) return;
  showConfirm('이 내역을 삭제할까요?', () => {
    colRef.doc(editingId).delete()
      .then(() => { closeEntryModal(); toast('삭제했어요'); })
      .catch((e) => toast('삭제 실패: ' + e.message));
  });
}

// ---------------------------------------------------------------------
// Receipt OCR flow
// ---------------------------------------------------------------------
function openReceiptModal() {
  $('#receipt-pick-view').classList.remove('hidden');
  $('#receipt-progress-view').classList.add('hidden');
  $('#receipt-file-input').value = '';
  show($('#receipt-modal'));
}
function closeReceiptModal() { hide($('#receipt-modal')); }

// 사진을 적당한 크기로 줄이고 base64로 바꿈 (Vision API에 보내기 위함 — 속도/용량 절약용 축소만 하고
// 색은 원본 그대로 둠. Vision은 자체적으로 색이 있는 실제 사진에 최적화돼 있어서 흑백처리가 필요 없음)
function prepareImageBase64(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      try {
        const longSide = Math.max(img.width, img.height);
        const scale = longSide > 1600 ? 1600 / longSide : 1;
        const width = Math.max(1, Math.round(img.width * scale));
        const height = Math.max(1, Math.round(img.height * scale));
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
        resolve(dataUrl.split(',')[1]); // "data:image/jpeg;base64," 뒷부분만
      } catch (e) { reject(e); }
    };
    img.onerror = () => reject(new Error('이미지를 열 수 없어요'));
    img.src = URL.createObjectURL(file);
  });
}

// Google Cloud Vision API(DOCUMENT_TEXT_DETECTION)로 영수증 사진의 글자를 읽어옴
async function recognizeReceiptText(file) {
  if (!GOOGLE_VISION_API_KEY || GOOGLE_VISION_API_KEY.startsWith('PASTE_')) {
    throw new Error('Vision API 키가 아직 설정되지 않았어요');
  }
  const base64 = await prepareImageBase64(file);

  const resp = await fetch(`https://vision.googleapis.com/v1/images:annotate?key=${GOOGLE_VISION_API_KEY}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      requests: [{
        image: { content: base64 },
        features: [{ type: 'DOCUMENT_TEXT_DETECTION' }],
        imageContext: { languageHints: ['ko', 'en'] },
      }],
    }),
  });

  if (!resp.ok) {
    let msg = 'OCR 요청 실패 (' + resp.status + ')';
    try { const errJson = await resp.json(); if (errJson.error && errJson.error.message) msg = errJson.error.message; } catch (e) {}
    throw new Error(msg);
  }

  const data = await resp.json();
  const result = data.responses && data.responses[0];
  if (!result) throw new Error('OCR 응답이 비어있어요');
  if (result.error) throw new Error(result.error.message || 'OCR 오류');

  const text = (result.fullTextAnnotation && result.fullTextAnnotation.text) || '';
  if (!text) throw new Error('글자를 찾지 못했어요');
  return text;
}

function handleReceiptFile(file) {
  if (!file) return;
  $('#receipt-pick-view').classList.add('hidden');
  $('#receipt-progress-view').classList.remove('hidden');
  $('#ocr-status-text').textContent = '영수증을 읽고 있어요...';

  const url = URL.createObjectURL(file);
  $('#receipt-thumb').src = url;

  recognizeReceiptText(file)
    .then((text) => {
      const parsed = parseReceiptText(text);
      parsed.photoUrl = url; // 확인 화면에서 사진과 나란히 비교할 수 있도록 전달
      closeReceiptModal();
      openEntryModal(null, parsed);
    })
    .catch((err) => {
      closeReceiptModal();
      toast('영수증을 읽지 못했어요. 직접 입력해주세요. (' + err.message + ')', 3800);
      openEntryModal(null, { type: 'expense', photoUrl: url });
    });
}

function parseReceiptText(text) {
  return {
    type: 'expense',
    category: guessCategory(text), // 확실하지 않으면 null → 직접 고르시도록 비워둠
    amount: extractAmount(text),
    date: extractDate(text) || todayStr(),
    memo: extractStoreName(text),
  };
}

// 영수증 글자에 특정 가게/항목 단어가 보이면 분류를 추측, 애매하면 비워서 직접 고르게 함
function guessCategory(text) {
  const rules = [
    ['medical', /약국|병원|의원|한의원|치과|정형외과|내과/],
    ['transport', /택시|버스|지하철|주유소|충전소|하이패스|교통카드|철도|고속버스/],
    ['bill', /통신요금|전기요금|가스요금|관리비|보험료|도시가스|이동통신/],
    ['hobby', /서점|영화관|CGV|메가박스|여행사|헬스|당구|골프/],
    ['event', /화환|장례|상조|축의|경조/],
    ['daily', /다이소|마트|슈퍼|시장|이마트|홈플러스|롯데마트|하나로마트|세탁소/],
    ['food', /편의점|식당|반찬|정육|과일|베이커리|카페|커피|김밥|분식/],
  ];
  for (const [key, re] of rules) {
    if (re.test(text)) return key;
  }
  return null;
}

function extractAmount(text) {
  const lines = text.split('\n');
  const keywordRe = /(합\s*계|총\s*액|총\s*금액|받을\s*금액|결제\s*금액|승인\s*금액|판매\s*금액|지불\s*금액|청구\s*금액|카드\s*금액|매출\s*금액|TOTAL)/i;
  const excludeRe = /(거스름|잔돈|적립|포인트|전화|TEL|사업자|등록번호|카드번호|승인번호|일련번호)/i;
  const numRe = /(\d{1,3}(?:,\d{3})+|\d{4,})/g;

  let best = null;
  for (const line of lines) {
    if (excludeRe.test(line)) continue;
    if (keywordRe.test(line)) {
      const nums = [...line.matchAll(numRe)].map((m) => parseInt(m[1].replace(/,/g, ''), 10));
      const valid = nums.filter((n) => n >= 100 && n <= 5000000);
      if (valid.length) {
        const v = Math.max(...valid);
        if (best === null || v > best) best = v;
      }
    }
  }
  if (best !== null) return best;

  // 총액 문구를 못 찾으면: 쉼표가 찍힌(1,000 형태) 숫자 중 가장 큰 값을 총액으로 추정
  // (쉼표 없는 숫자는 전화번호·바코드일 가능성이 높아 마지막 순위로만 사용)
  const usableLines = lines.filter((l) => !excludeRe.test(l));
  const commaNumRe = /\d{1,3}(?:,\d{3})+/g;
  const commaNums = usableLines
    .join('\n')
    .match(commaNumRe);
  if (commaNums) {
    const valid = commaNums.map((s) => parseInt(s.replace(/,/g, ''), 10)).filter((n) => n >= 100 && n <= 5000000);
    if (valid.length) return Math.max(...valid);
  }

  const allNums = usableLines.join('\n').match(numRe) || [];
  const valid = allNums.map((s) => parseInt(s.replace(/,/g, ''), 10)).filter((n) => n >= 100 && n <= 5000000);
  if (valid.length) return Math.max(...valid);
  return '';
}

function extractDate(text) {
  const re = /(20\d{2})\s*[.\-\/년]\s*(\d{1,2})\s*[.\-\/월]\s*(\d{1,2})/;
  const m = text.match(re);
  if (!m) return null;
  const y = parseInt(m[1], 10), mo = parseInt(m[2], 10), da = parseInt(m[3], 10);
  if (mo < 1 || mo > 12 || da < 1 || da > 31) return null;
  return `${y}-${pad2(mo)}-${pad2(da)}`;
}

function extractStoreName(text) {
  const lines = text.split('\n').map((l) => l.trim()).filter(Boolean);
  if (!lines.length) return '';
  // 너무 짧거나 숫자/기호뿐인 줄은 건너뛰기
  for (const line of lines.slice(0, 5)) {
    const cleaned = line.replace(/[^가-힣A-Za-z0-9\s]/g, '').trim();
    if (cleaned.length >= 2 && !/^\d+$/.test(cleaned)) {
      return cleaned.slice(0, 20);
    }
  }
  return '';
}

// ---------------------------------------------------------------------
// CSV export
// ---------------------------------------------------------------------
function exportCsv() {
  const key = monthKey(viewDate);
  const monthTx = allTx.filter((t) => t.date && t.date.startsWith(key));
  if (!monthTx.length) return toast('내보낼 내역이 없어요.');

  let csv = '﻿날짜,구분,분류,금액,메모\n';
  monthTx
    .slice()
    .sort((a, b) => (a.date < b.date ? -1 : 1))
    .forEach((t) => {
      const cat = findCategory(t.type, t.category);
      const row = [t.date, t.type === 'income' ? '수입' : '지출', cat ? cat.label : '기타', t.amount, (t.memo || '').replace(/,/g, ' ')];
      csv += row.join(',') + '\n';
    });

  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `가계부_${key}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ---------------------------------------------------------------------
// Wire up static event listeners
// ---------------------------------------------------------------------
function wireEvents() {
  $('#prev-month').addEventListener('click', () => {
    viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth() - 1, 1);
    render();
  });
  $('#next-month').addEventListener('click', () => {
    viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth() + 1, 1);
    render();
  });

  $('#tab-list').addEventListener('click', () => switchTab('list'));
  $('#tab-stats').addEventListener('click', () => switchTab('stats'));

  $('#settings-link').addEventListener('click', (e) => {
    e.preventDefault();
    hide($('#app'));
    hide($('#bottom-bar'));
    renderSettingsScreen();
    show($('#setup-screen'));
  });

  $('#open-manual').addEventListener('click', () => openEntryModal(null));
  $('#entry-close').addEventListener('click', closeEntryModal);
  $('#entry-cancel').addEventListener('click', closeEntryModal);
  $('#entry-save').addEventListener('click', saveEntry);
  $('#entry-delete').addEventListener('click', deleteEntry);
  $('#type-expense').addEventListener('click', () => setEntryType('expense'));
  $('#type-income').addEventListener('click', () => setEntryType('income'));

  $('#amount-input').addEventListener('input', (e) => {
    const digits = e.target.value.replace(/[^0-9]/g, '');
    e.target.value = digits ? new Intl.NumberFormat('ko-KR').format(parseInt(digits, 10)) : '';
  });

  $('#open-receipt').addEventListener('click', openReceiptModal);
  $('#receipt-close').addEventListener('click', closeReceiptModal);
  $('#receipt-camera-btn').addEventListener('click', () => $('#receipt-file-input').click());
  $('#receipt-file-input').addEventListener('change', (e) => handleReceiptFile(e.target.files[0]));

  // 모달 바깥(어두운 배경) 클릭 시 닫기
  [
    ['#entry-modal', closeEntryModal],
    ['#receipt-modal', closeReceiptModal],
  ].forEach(([sel, closer]) => {
    $(sel).addEventListener('click', (e) => { if (e.target === $(sel)) closer(); });
  });
}

// ---------------------------------------------------------------------
// Boot
// ---------------------------------------------------------------------
document.addEventListener('DOMContentLoaded', () => {
  $('#app-version').textContent = APP_VERSION;
  wireEvents();
  initFirebase();
});

</script>
